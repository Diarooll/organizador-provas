services:
  postgres:
    image: postgres:16
    container_name: provas-db
    environment:
      POSTGRES_DB: provas
      POSTGRES_USER: diego
      POSTGRES_PASSWORD: "2301"
    ports:
      - "5433:5432"
    volumes:
      - provas-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  provas-data: