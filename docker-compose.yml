services:
  postgres:
    image: postgres:16
    container_name: provas-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - provas-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  provas-data:
